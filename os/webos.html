<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>天择OS · 天择网操作系统</title>
  <meta name="description" content="天择OS —— 一个在浏览器中运行的全屏模拟操作系统，内嵌天择网全部功能与 AI 代码生成引擎。" />
  <link rel="stylesheet" href="https://wjtianze.github.io/os/assets/css/os.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='.5' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%2310b981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M10 14h12v8a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2v-8zm2-4a4 4 0 0 1 8 0v4h-8v-4z' fill='white'/%3E%3C/svg%3E" />
</head>
<body class="tzos">
  <!-- 开机动画 -->
  <div id="bootScreen" class="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 32 32" width="64" height="64"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#bg)"/><path d="M10 14h12v8a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2v-8zm2-4a4 4 0 0 1 8 0v4h-8v-4z" fill="white"/></svg>
    </div>
    <div class="boot-name">天择OS</div>
    <div class="boot-spinner"><span></span><span></span><span></span></div>
    <div class="boot-tip" id="bootTip">正在唤醒系统…</div>
  </div>

  <!-- 桌面 -->
  <div id="desktop" class="desktop" hidden>
    <!-- 桌面图标层 -->
    <div id="desktopIcons" class="desktop-icons"></div>

    <!-- 移动端主屏（与桌面图标共用数据，仅布局不同） -->
    <div id="homeScreen" class="home-screen" hidden></div>

    <!-- 窗口容器 -->
    <div id="windows" class="windows-layer"></div>

    <!-- 右键菜单 -->
    <div id="ctxMenu" class="ctx-menu" hidden></div>

    <!-- 开始菜单（Windows 风格） -->
    <div id="startMenu" class="start-menu" hidden>
      <div class="start-search">
        <input id="startSearch" type="text" placeholder="搜索应用…" />
      </div>
      <div class="start-apps" id="startApps"></div>
      <div class="start-footer">
        <button class="start-close-btn" id="btnStartClose" title="关闭开始菜单">✕ 关闭</button>
        <button class="start-power" id="btnPower" title="关机/刷新">⏻</button>
        <button class="start-settings" id="btnSettings" title="系统设置">⚙</button>
      </div>
    </div>

    <!-- 左下角悬浮窗（可拖拽 / 可关闭） -->
    <div id="floatingWidget" class="floating-widget">
      <div class="fw-header" id="fwHeader">
        <span class="fw-title">⚡ 快捷面板</span>
        <button class="fw-close" id="fwClose" title="关闭">×</button>
      </div>
      <div class="fw-body">
        <div class="fw-clock" id="fwClock">--:--</div>
        <div class="fw-actions">
          <button class="fw-btn" data-app="ai-chat" title="AI 对话">💬</button>
          <button class="fw-btn" data-app="app-store" title="软件商城">🛒</button>
          <button class="fw-btn" data-app="settings" title="系统设置">⚙️</button>
        </div>
      </div>
    </div>
    <button id="fwReopen" class="fw-reopen hidden" title="显示快捷面板">⚡</button>

    <!-- 任务栏（Windows 风格 / 通用底栏） -->
    <div id="taskbar" class="taskbar">
      <button class="tb-start" id="btnStart" title="开始">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="8" height="8" rx="2" fill="url(#tg1)"/><rect x="13" y="3" width="8" height="8" rx="2" fill="url(#tg2)"/><rect x="3" y="13" width="8" height="8" rx="2" fill="url(#tg3)"/><rect x="13" y="13" width="8" height="8" rx="2" fill="url(#tg4)"/><defs><linearGradient id="tg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="tg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/></linearGradient><linearGradient id="tg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="tg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs></svg>
      </button>
      <div class="tb-running" id="tbRunning"></div>
      <div class="tb-tray">
        <button class="tb-tray-btn" id="btnTheme" title="切换浅色/深色主题">🌓</button>
        <button class="tb-tray-btn" id="btnStyle" title="切换桌面风格">🖥</button>
        <button class="tb-tray-btn" id="btnAiConfig" title="AI 配置">🔑</button>
        <span class="tb-clock" id="tbClock"></span>
      </div>
      <button class="tb-show-desktop" id="btnShowDesktop" title="显示桌面（最小化所有窗口，再点复原）"></button>
    </div>

    <!-- 移动端底栏 Home 条 + Dock -->
    <div id="mobileDock" class="mobile-dock" hidden></div>
    <div id="homeBar" class="home-bar" hidden></div>

    <!-- 通知中心 -->
    <div id="notifCenter" class="notif-center" hidden></div>
  </div>

  <script defer src="https://wjtianze.github.io/os/assets/js/os.js"></script>
</body>
</html>
