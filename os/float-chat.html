<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 悬浮窗 · 天择OS</title>
<link rel="stylesheet" href="https://wjtianze.github.io/os/assets/css/os.css?v=5.3.0">
<style>
/* 悬浮窗专用：隐藏 OS 桌面元素，让 AI 对话占满整个窗口 */
body.tzos { position: relative; height: 100vh; overflow: hidden; background-image: var(--os-wallpaper); background-size: cover; background-position: center; }
#bootScreen { display: none !important; }
#desktop, #taskbar, #mobileDock, #homeBar, #notifCenter, #ctxMenu, #startMenu, #floatingWidget, #fwReopen { display: none !important; }
#floatRoot { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: 32px; }
body.float-embedded #floatRoot { padding-top: 0; }
body.float-embedded #floatTitleBar { display: none; }
body.float-site #floatRoot .chat-toolbar { padding: 6px 9px; }
body.float-site #floatRoot .chat-tabbar { min-height: 44px; padding: 6px 8px; }
body.float-site #floatRoot .msg { animation-duration: .16s; }
body.float-site #floatRoot .btn,
body.float-site #floatRoot .chat-tab,
body.float-site #floatRoot .chat-tab-new,
body.float-site #floatRoot .chat-send { transition-duration: .14s; }
body.float-site #floatRoot .site-ai-badge { white-space: nowrap; }
#floatRoot .app-chat { flex: 1; min-height: 0; border: none; border-radius: 0; }
#floatRoot .chat-toolbar { padding-left: 12px; }

/* 自定义拖拽标题栏（无边框窗口必须提供）
 * 拖拽采用 Electron 官方推荐方式 -webkit-app-region: drag
 * 由 Chromium 原生接管，无需 JS pointer 事件 + IPC，丝滑且无"跳跃" */
#floatTitleBar {
  position: absolute; top: 0; left: 0; right: 0; height: 32px;
  display: flex; align-items: center; padding: 0 10px; gap: 8px;
  background-image: linear-gradient(rgba(9,15,34,.62),rgba(9,15,34,.62)), var(--os-surface);
  background-size: cover;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: move; user-select: none; z-index: 10;
  -webkit-app-region: drag;
}
#floatTitleBar .ficon { width: 16px; height: 16px; pointer-events: none; }
#floatTitleBar .ftext { font-size: 12px; color: var(--c-violet-soft); flex: 1; pointer-events: none; }
#floatTitleBar .fbtn {
  width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 12px; display: flex; align-items: center; justify-content: center;
  transition: filter .14s;
  -webkit-app-region: no-drag;
}
#floatTitleBar .fbtn:hover { filter: brightness(1.2); }
#floatTitleBar .fbtn.close { background-image: linear-gradient(rgba(95,8,17,.58),rgba(95,8,17,.58)), var(--os-button); background-size: cover; color: #fff; }

/* 站内嵌入态是网站工具，不沿用桌面系统的壁纸和图片按钮。 */
body.float-site {
  background: #071719 !important;
  color: #edf5f3;
  font-family: "Microsoft YaHei UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
body.float-site #floatRoot,
body.float-site #floatRoot .app-chat,
body.float-site #floatRoot .chat-messages,
body.float-site #floatRoot .chat-input-bar,
body.float-site #floatRoot .chat-toolbar,
body.float-site #floatRoot .chat-tabbar {
  background-color: #08191d !important;
  background-image: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
body.float-site #floatRoot .chat-toolbar {
  display: flex;
  flex-wrap: wrap !important;
  gap: 6px;
  overflow-x: hidden !important;
  scrollbar-width: none;
}
body.float-site #floatRoot .chat-toolbar::-webkit-scrollbar { display: none; }
body.float-site #floatRoot .chat-toolbar > .btn { flex: 0 1 auto !important; }
body.float-site #floatRoot :is(
  .btn,
  .chat-flag,
  .chat-ctx,
  .chat-suggest-chip,
  .chat-send,
  .chat-attach-btn,
  .chat-tab,
  .chat-tab-new,
  .msg-act,
  .msg-avatar,
  .ce-icon
) {
  background-image: none !important;
  background-blend-mode: normal !important;
  text-shadow: none !important;
  box-shadow: none !important;
}
body.float-site #floatRoot :is(.btn, .chat-ctx, .chat-suggest-chip, .chat-tab, .chat-tab-new, .msg-act) {
  border-color: rgba(143, 199, 188, .24) !important;
  border-radius: 7px;
  background-color: #10272b !important;
  color: #dbe9e6 !important;
}
body.float-site #floatRoot .chat-send {
  border: 1px solid rgba(110, 224, 198, .48) !important;
  border-radius: 7px;
  background-color: #5bcab1 !important;
  color: #061716 !important;
}
body.float-site #floatRoot .chat-input-bar textarea {
  border-color: rgba(143, 199, 188, .22) !important;
  background: #0c2024 !important;
  color: #edf5f3 !important;
}
body.float-site #floatRoot .chat-empty .ce-icon,
body.float-site #floatRoot .msg-avatar {
  border: 0 !important;
  background-color: transparent !important;
}
body.float-site #floatRoot .chat-suggest-chip {
  padding: 8px 11px;
  border-radius: 7px;
}
</style>
  <link rel="icon" type="image/png" href="https://wjtianze.github.io/assets/img/brand/tianze-mark.png?rev=20260828j" />
</head>
<body class="tzos">
<script>
var __tzFloatParams = new URLSearchParams(location.search);
window.__tzSiteEmbedMode = __tzFloatParams.get('site') === '1';
if (__tzFloatParams.get('embedded') === '1') document.body.classList.add('float-embedded');
if (window.__tzSiteEmbedMode) document.body.classList.add('float-site');
try {
  // 站内助手是独立产品面；嵌入模式绝不读取天择OS的 tzos_state_v1。
  // 普通天择OS悬浮窗仍沿用原主题与配色。
  if (!window.__tzSiteEmbedMode) {
    var __tzBootState = JSON.parse(localStorage.getItem("tzos_state_v1") || "{}");
    if (__tzBootState.theme === "light") document.body.classList.add("light");
    if (__tzBootState.palette === "mid" || __tzBootState.palette === "warm") {
      document.body.setAttribute("data-palette", __tzBootState.palette);
    }
  }
} catch (_) {}
</script>
<!-- 占位元素：os.js 需要这些 DOM 节点才能正常初始化 -->
<div id="bootScreen" class="boot-screen" hidden></div>
<div id="desktop" hidden></div>
<div id="taskbar" hidden></div>
<div id="mobileDock" hidden></div>
<div id="homeBar" hidden></div>
<div id="notifCenter" hidden></div>
<div id="ctxMenu" hidden></div>
<div id="startMenu" hidden></div>
<div id="floatingWidget" hidden></div>
<button id="fwReopen" hidden></button>
<!-- 修复 v3.2：AI 悬浮窗中执行 clock/timer/openurl/browser/store 等命令时，
     WM.create 需要 #windows 挂载窗口元素（即使浮窗不显示窗口，逻辑也必须能跑通）。
     这个容器保持 hidden，WM.create 在浮窗模式下创建的窗口会挂到这里但不显示 -->
<div id="windows" class="windows-layer" hidden></div>

<!-- 自定义拖拽标题栏 -->
<div id="floatTitleBar">
  <span class="ficon tz-icon" style="--tz-ix:5;--tz-iy:1"></span>
  <span class="ftext">站内助手 · 5.3.0</span>
  <button class="fbtn close" id="floatCloseBtn" title="关闭 (Esc)" aria-label="关闭 AI 悬浮窗"><span class="tz-icon" style="--tz-ix:1;--tz-iy:4"></span></button>
</div>

<!-- 悬浮窗主体：完整的 AI 对话 -->
<div id="floatRoot"></div>

<script>
// 标记为悬浮窗模式，os.js 的 boot() 会走轻量路径
window.__tzFloatMode = true;
</script>
<script src="https://wjtianze.github.io/assets/js/cloud-security.js?v=5.3.0"></script>
<script src="https://wjtianze.github.io/os/assets/js/coc-live-service.js?v=5.3.0"></script>
<script src="https://wjtianze.github.io/os/assets/js/ai-tools.js?v=5.3.0"></script>
<script src="https://wjtianze.github.io/os/assets/js/local-data-actions.js?v=5.3.0"></script>
<script src="https://wjtianze.github.io/os/assets/js/cli-engine.js?v=5.3.0"></script>
<script src="https://wjtianze.github.io/os/assets/js/os.js?v=5.3.0-20260828j"></script>
<script>
(function() {
  'use strict';
  function waitForTZOS(cb, attempts) {
    attempts = attempts || 0;
    if (window.TZOS && window.TZOS.initChat && window.TZOS.renderAIChat) { cb(); return; }
    if (attempts > 400) { document.getElementById('floatRoot').innerHTML = '<div style="padding:40px;text-align:center;color:#8b94b8;font-size:13px">加载超时，请重启天择OS</div>'; return; }
    setTimeout(function() { waitForTZOS(cb, attempts + 1); }, 25);
  }

  waitForTZOS(function() {
    var root = document.getElementById('floatRoot');
    var winId = 'float-chat-win';
    var siteMode = !!window.__tzSiteEmbedMode;
    if (siteMode) {
      document.title = '天择网站内助手';
      var title = document.querySelector('#floatTitleBar .ftext');
      if (title) title.textContent = '天择网站内助手';
    }
    // 复用完整的 renderAIChat（含工具栏、消息区、附件、输入框与 Agent 开关）
    root.innerHTML = window.TZOS.renderAIChat({ floatMode: true, siteMode: siteMode, disableAgent: siteMode });
    // Agent 命令由 preload 的受控 IPC 转交给天择OS主窗口执行
    window.TZOS.initChat(winId, siteMode);
    // 关闭按钮只在顶栏（floatCloseBar），工具栏不再重复添加
    // Esc 关闭
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && !siteMode) window.close();
    });

    // 标题栏关闭按钮
    document.getElementById('floatCloseBtn').onclick = function() { window.close(); };

    // ===== 窗口拖拽 =====
    // 已改用 CSS -webkit-app-region: drag（见 <style>），由 Chromium 原生接管。
    // 无需 JS pointer 事件 + IPC setPosition，避免"窗口跳到鼠标中心"和
    // "鼠标脱离 32px 标题栏后拖拽中断"两个问题。关闭按钮已标 no-drag，点击不受影响。
  });
})();
</script>
</body>
</html>
