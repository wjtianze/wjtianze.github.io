  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='.5' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%2310b981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 6l3 7 7 .5-5.3 4.6L23 25l-7-4.2L9 25l1.8-6.9L5.5 13.5 12.5 13z' fill='white'/%3E%3C/svg%3E" />
  <style>
    .coc-wb { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    .coc-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .coc-nav a { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); text-decoration: none; font-weight: 600; font-size: 15px; color: var(--ink); transition: transform .16s, box-shadow .16s; }
    .coc-nav a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,58,237,.14); }
    .coc-main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 560px; }
    .coc-panel { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .coc-ph { padding: 10px 14px; border-bottom: 1px solid var(--glass-border); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .coc-json-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #cocJsonInput { flex: 1; width: 100%; border: none; outline: none; resize: none; padding: 12px 14px; font-family: 'Consolas', 'Menlo', monospace; font-size: 12px; line-height: 1.5; background: transparent; color: var(--ink); min-height: 0; }
    .coc-out { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 13px; line-height: 1.7; min-height: 0; }
    .coc-stat { display: inline-block; padding: 3px 10px; border-radius: 999px; background: rgba(124,58,237,.12); margin: 3px 4px 3px 0; font-size: 12px; white-space: nowrap; }
    .coc-empty { color: var(--ink-faint); text-align: center; padding: 48px 20px; font-size: 13px; }
    .coc-err { color: #ef4444; }
    .coc-blist { font-size: 11.5px; line-height: 1.7; max-height: 300px; overflow-y: auto; }
    .coc-blist span { display: inline-block; width: 33%; padding: 1px 4px; box-sizing: border-box; }
    @media (max-width: 720px) { .coc-main { grid-template-columns: 1fr; height: auto; } .coc-panel { height: 340px; } .coc-nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="https://wjtianze.github.io/index.html" aria-label="天择网首页">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2l2.6 6.2L21 9l-5 4.4L17.6 21 12 17.3 6.4 21 8 13.4 3 9l6.4-.8L12 2z" fill="#fff"/>
          </svg>
        </span>
        <span class="logo-text">天择网</span>
      </a>
      <button class="nav-toggle" aria-label="菜单">☰</button>
      <nav class="nav"><a href="https://wjtianze.github.io/index.html"><span>首页</span></a><a href="https://wjtianze.github.io/news/index.html"><span>新闻</span></a><a href="https://wjtianze.github.io/blog/index.html"><span>博客</span></a><a href="https://wjtianze.github.io/open/index.html"><span>数据开源</span></a><a href="https://wjtianze.github.io/ai/index.html"><span>AI 专区</span></a><a href="https://wjtianze.github.io/coc/index.html" class="active"><span>COC 专区</span></a><a href="https://wjtianze.github.io/game/index.html"><span>游戏专区</span></a><a href="https://wjtianze.github.io/english/index.html"><span>英语专区</span></a><a href="https://wjtianze.github.io/os/index.html"><span>天择OS</span></a><a href="https://wjtianze.github.io/contact/index.html"><span>联系开发者</span></a></nav>
    </div>
  </header>

  <main>
    <section class="coc-hero wrap">
      <div class="coc-badge reveal in">🛡️ COC 专区 · Clash of Clans</div>
      <h1 class="reveal in d1">村庄存档 <span class="grad">实时分析</span></h1>
      <p class="reveal in d2">粘贴村庄 JSON 即可实时分析，自动保存到本地。下方可进入数据查询、升级规划与伤害计算。</p>
    </section>

    <section class="section coc-wb">
      <div class="section-head reveal">
        <h2><span class="bar"></span>村庄存档工作台</h2>
      </div>
      <!-- 第一行：二级专区导航（小高度） -->
      <div class="coc-nav reveal d1">
        <a href="https://wjtianze.github.io/coc/data/index.html"><span>📊</span><span>数据查询</span></a>
        <a href="https://wjtianze.github.io/coc/planner/index.html"><span>📅</span><span>升级规划</span></a>
        <a href="https://wjtianze.github.io/coc/dmg-calc/index.html"><span>💥</span><span>伤害计算</span></a>
      </div>
      <!-- 第二行：JSON 输入 + 实时存档分析（大高度） -->
      <div class="coc-main reveal d2">
        <div class="coc-panel">
          <div class="coc-ph">📋 村庄 JSON 输入</div>
          <div class="coc-json-area">
            <textarea id="cocJsonInput" placeholder="粘贴从游戏导出的村庄存档 JSON…&#10;输入后右侧实时分析，并自动保存到本地（与天择OS命令行 coc-data、村庄分析页共享）。"></textarea>
          </div>
        </div>
        <div class="coc-panel">
          <div class="coc-ph">🔍 存档分析（实时）</div>
          <div class="coc-out" id="cocOut"><div class="coc-empty">粘贴村庄 JSON 后这里实时显示分析结果</div></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div>© 2026 天择网 · 物竞天择，适者生存</div>
      <div class="links"><a href="https://wjtianze.github.io/index.html">主页</a><a href="https://wjtianze.github.io/news/index.html">新闻</a><a href="https://wjtianze.github.io/blog/index.html">博客</a><a href="https://wjtianze.github.io/open/index.html">数据开源</a><a href="https://wjtianze.github.io/ai/index.html">AI 专区</a><a href="https://wjtianze.github.io/coc/index.html">COC 专区</a><a href="https://wjtianze.github.io/game/index.html">游戏专区</a><a href="https://wjtianze.github.io/english/index.html">英语专区</a><a href="https://wjtianze.github.io/os/index.html">天择OS</a><a href="https://wjtianze.github.io/contact/index.html">联系开发者</a></div>
    </div>
  </footer>

  <script>
  /* 实时存档分析：解析村庄 JSON，显示基本信息，并保存到 localStorage（与村庄分析页、天择OS coc-data 命令共享） */
  (function () {
    var input = document.getElementById('cocJsonInput');
    var out = document.getElementById('cocOut');
    // 启动时自动载入已保存的村庄存档
    try {
      var s = JSON.parse(localStorage.getItem('tz_coc_village') || 'null');
      if (s && s.village) { input.value = typeof s.village === 'string' ? s.village : JSON.stringify(s.village, null, 2); }
    } catch (e) {}

    function analyze() {
      var txt = input.value.trim();
      if (!txt) { out.innerHTML = '<div class="coc-empty">粘贴村庄 JSON 后这里实时显示分析结果</div>'; return; }
      var v;
      try { v = JSON.parse(txt); } catch (e) { out.innerHTML = '<div class="coc-err">JSON 格式错误：' + e.message + '</div>'; return; }
      var bs = v.buildings || [], tp = v.troops || [], he = v.heroes || [], sp = v.spells || [], tr = v.traps || [];
      var th = 0, bh = 0;
      bs.forEach(function (b) {
        if (b.data === 1000001) th = b.lvl || 0;
        if (b.data === 4400001 || b.data === 4000001) bh = b.lvl || 0;
      });
      // 建筑按 data 去重计数
      var bmap = {};
      bs.forEach(function (b) { var k = b.data; if (!bmap[k]) bmap[k] = { data: k, lvl: b.lvl, cnt: 0 }; bmap[k].cnt += (b.cnt || 1); });
      var h = '<div style="margin-bottom:8px">';
      h += '<span class="coc-stat">🏰 大本 ' + th + ' 级</span>';
      if (bh) h += '<span class="coc-stat">🌙 夜世界 ' + bh + ' 级</span>';
      h += '<span class="coc-stat">📦 建筑 ' + bs.length + '</span>';
      h += '<span class="coc-stat">⚔️ 兵种 ' + tp.length + '</span>';
      h += '<span class="coc-stat">🦸 英雄 ' + he.length + '</span>';
      h += '<span class="coc-stat">✨ 法术 ' + sp.length + '</span>';
      h += '<span class="coc-stat">🪤 陷阱 ' + tr.length + '</span>';
      h += '</div>';
      h += '<div style="font-size:12px;color:var(--ink-faint);margin:6px 0 4px">建筑列表（ID · 等级 · 数量）：</div>';
      h += '<div class="coc-blist">';
      Object.keys(bmap).forEach(function (k) { var b = bmap[k]; h += '<span>ID' + b.data + ' · Lv' + b.lvl + ' ×' + b.cnt + '</span>'; });
      h += '</div>';
      h += '<div style="margin-top:10px;font-size:11.5px;color:var(--ink-faint)">✓ 已自动保存到本地。完整分析（建筑名称 / 升级时间 / 防御覆盖）请<a href="https://wjtianze.github.io/coc/village/index.html" style="color:var(--accent);text-decoration:underline">进入村庄分析</a>。</div>';
      out.innerHTML = h;
      // 保存到 localStorage（与村庄分析页、coc-data 命令共享同一份数据）
      try { localStorage.setItem('tz_coc_village', JSON.stringify({ village: v, th: th, bh: bh, ts: Date.now() })); } catch (e) {}
    }
    input.addEventListener('input', analyze);
    analyze();
  })();
  </script>
  <script defer src="https://wjtianze.github.io/assets/js/main.js?v=20260722a"></script>
</body>
